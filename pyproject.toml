[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hidra"
version = "0.1.0"
description = "HiDRA -- the High-Dimensional Rodent Annotator: per-lab-head mouse behaviour classifier ensemble"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Talmo Lab", email = "talmo@salk.edu" }]
keywords = ["behavior", "pose", "ethology", "neuroscience", "mice"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "huggingface-hub>=0.34",
]

[project.optional-dependencies]
# PyTorch inference/training backend (the default going forward).
torch = ["torch>=2.6"]
# The original JAX backend. Needed to reproduce reference outputs and to run the
# exactness tests that compare the two backends.
#
# numpy<2.5 is a hard requirement of the *reference* code, not of JAX: numpy 2.5 stopped
# accepting nested sequences in np.random.SeedSequence, and reference/solution.py seeds its
# epoch shuffle with `default_rng([epoch_idx, dataset.seed])` where dataset.seed is itself a
# list. The port fixes that by flattening the seed (bit-identical stream -- see
# tests/test_seed_flattening.py), but the pristine reference cannot be edited.
jax = ["jax[cuda12]==0.9.2", "numpy<2.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[project.scripts]
hidra-predict = "hidra.cli:main"
hidra-finetune = "hidra.finetune:main"
hidra-download-models = "hidra.download_models:main"
hidra-convert-weights = "hidra.torch.convert:main"

[project.urls]
Homepage = "https://github.com/talmolab/HiDRA"
Weights = "https://huggingface.co/talmolab/HiDRA"

[tool.hatch.build.targets.wheel]
packages = ["src/hidra"]

[tool.hatch.build.targets.sdist]
include = ["src/hidra", "docs", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "jax: requires the JAX backend installed",
    "slow: full-ensemble / end-to-end runs",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["E741"]
